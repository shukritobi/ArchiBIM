name: ArchiBIM CI and RBZ package
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
permissions:
  contents: read
jobs:
  test-and-package:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: '3.2'
      - name: Check Ruby syntax
        run: |
          ruby -c ArchiBIM.rb
          for file in archibim/*.rb; do ruby -c "$file"; done
      - name: Run all Ruby regression tests
        run: ruby -e 'Dir["test/test_*.rb"].sort.each { |file| require_relative file }'
      - name: Validate embedded UI script
        run: |
          sed -n '/<script>/,/<\/script>/p' archibim/ui/panel.html | sed '1d;$d' > /tmp/archibim-panel.js
          node --check /tmp/archibim-panel.js
      - name: Build RBZ and verify contents
        run: |
          mkdir -p dist
          zip -q -r dist/ArchiBIM_v0.3.0.rbz ArchiBIM.rb archibim -x '*.tmp'
          unzip -t dist/ArchiBIM_v0.3.0.rbz | tail -1
      - uses: actions/upload-artifact@v4
        with:
          name: ArchiBIM_v0.3.0
          path: dist/ArchiBIM_v0.3.0.rbz
