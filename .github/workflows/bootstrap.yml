name: Bootstrap ArchiBIM source
on:
  push:
    paths:
      - '.bootstrap/**'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: archibim-initial-import
  cancel-in-progress: true

jobs:
  import:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - name: Verify complete source package
        id: package
        run: |
          count=$(find .bootstrap -maxdepth 1 -type f -name 'part_*.b64' | wc -l)
          echo "count=$count" >> "$GITHUB_OUTPUT"
          if [ "$count" -ne 9 ]; then
            echo "Waiting for all nine source transfer parts; found $count."
          fi
      - name: Unpack and commit full SketchUp project
        if: steps.package.outputs.count == '9'
        run: |
          set -euo pipefail
          cat .bootstrap/part_*.b64 | base64 --decode > /tmp/archibim-source.tar.xz
          echo "baef0fb529117bcfccbd2ca7340940cf9f50051d69390dbb0703cc51b29f038f  /tmp/archibim-source.tar.xz" | sha256sum --check
          tar -xJf /tmp/archibim-source.tar.xz -C .
          mkdir -p dist
          zip -q -r dist/ArchiBIM_v0.2.0.rbz ArchiBIM.rb archibim
          zip -q -r dist/ArchiBIM_Source_v0.2.0.zip ArchiBIM.rb archibim docs test LICENSE.txt README.md
          rm -rf .bootstrap
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --quiet || git commit -m "Import ArchiBIM v0.2.0 source, docs, tests, and RBZ"
          git push
